name: Build & Deploy blog-back

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            # 拉取最新代码
            if [ ! -d ~/blog-back ]; then
              git clone https://github.com/ForeverYoung-3/blog-back.git ~/blog-back
            else
              cd ~/blog-back && git pull
            fi
            cd ~/blog-back
            # 在服务器本地构建镜像
            docker build -t blog-back:latest .
            # 重启服务
            cd ~/blog
            docker compose up -d blog-back
            docker image prune -f
