server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://39.96.92.117:3306/blog_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Fap20020313@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 10MB       # 单文件最大 10MB
      max-request-size: 20MB    # 单次请求最大 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.back.entity
  configuration:
    map-underscore-to-camel-case: true   # 下划线自动转驼峰（cover_image -> coverImage）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-fetch-size: 100
    default-statement-timeout: 30

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# MinIO 配置
minio:
  endpoint: http://39.96.92.117:9000
  access-key: admin
  secret-key: "20020313"
  bucket-name: blog-images   # 存储桶名称，首次启动会自动创建

# JWT Configuration
jwt:
  secret: blog-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000        # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# Logging
logging:
  level:
    com.blog.back: DEBUG
    com.blog.back.mapper: DEBUG   # 打印 SQL
    org.springframework.security: INFO
